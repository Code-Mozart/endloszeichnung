<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#2979ff" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Endloszeichnung</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <div id="style" class="ui pop off">
    <div id="swatches"></div>
    <div id="recent" class="off"></div>
    <div id="picker" class="off">
      <div id="sv"><div id="svc"></div></div>
      <input type="range" id="hue" min="0" max="360" step="1" />
    </div>
    <label class="row"><span class="lbl">Width</span> <input type="range" id="width" min="0.5" max="40" step="0.5" /> <b id="wval"></b></label>
    <label class="row"><span class="lbl">Opacity</span> <input type="range" id="alpha" min="1" max="100" step="1" /> <b id="aval"></b></label>
  </div>

  <div id="images" class="ui pop off">
    <header><b>Images</b><button id="upload">＋ Upload</button></header>
    <div id="igrid"></div>
    <div class="hint">Tap an image: add to the active layer · ✕: remove from gallery</div>
    <input type="file" id="file" accept="image/*" multiple hidden />
  </div>

  <div id="layers" class="ui pop off">
    <header><b>Layers</b><button id="addLayer">＋ Add layer</button></header>
    <div id="llist"></div>
    <div id="lhint">Tap: make active · hold the name: rename · drag ☰: reorder</div>
  </div>

  <nav id="bar" class="ui">
    <div id="row2" class="brow off">
      <button id="north"><i id="rotIcon">🔒</i><span id="rotLbl">Rot N</span></button>
      <button id="wrapBtn"><i>🔁</i><span id="wrapLbl">Wrap</span></button>
      <button id="shapesBtn"><i><svg id="shapeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 20 4"/></svg></i><span id="shapeLbl">Line</span></button>
      <button id="gridBtn"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></i><span>Grid</span></button>
      <button id="imagesBtn"><i>🖼️</i><span>Images</span></button>
      <button id="layersBtn"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3 3 8l9 5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 16 9 5 9-5"/></svg></i><span>Layers</span></button>
      <button id="files"><i>🗂</i><span>Files</span></button>
    </div>
    <div class="brow">
      <button id="undo"><i>↶</i><span>Undo</span></button>
      <button id="redo"><i>↷</i><span>Redo</span></button>
      <button id="selBtn"><i>➰</i><span>Select</span></button>
      <button data-tool="pen"><i>✏️</i><span>Pen</span></button>
      <button id="styleBtn"><i><u id="dot"></u></i><span>Style</span></button>
      <button id="eraseBtn" data-tool="erase"><i id="eraseIcon">🧽</i><span id="eraseLbl">Erase</span></button>
      <button id="moreBtn"><i><svg id="moreArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></i><span id="moreLbl">More</span></button>
    </div>
  </nav>
  <div id="ver" class="on"></div>

  <div id="gal" class="off">
    <header><b>Drawings</b><button id="newDoc">＋ New</button><button id="closeGal">✕</button></header>
    <div id="list"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
